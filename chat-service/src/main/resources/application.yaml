spring:
  application:
    name: chat-backend
  main:
    banner-mode: off
  data:
    redis:
      connect-timeout: 1s
      timeout: 1s
  datasource:
    hikari:
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 15
        order_inserts: true
        order_updates: true
        connection.provider_disables_autocommit: true

centrifugo:
  url: http://localhost:8000
  api-key: 7bd5cf56-53bb-4710-8238-7186472819cb
  connect-timeout: 1s
  read-timeout: 1s
  refresh-interval: 5m

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, prometheus
