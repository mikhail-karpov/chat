server:
  netty:
    connection-timeout: 2s
    idle-timeout: 15s

spring:
  application:
    name: chat-api-gateway
  main:
    banner-mode: off
  cloud:
    gateway:
      default-filters:
        - SaveSession=
        - TokenRelay=
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s
        pool:
          max-idle-time: 15s
          max-life-time: 60s
      routes:
        - id: contact-service
          uri: ${contact-service-uri:http://localhost:8081}
          predicates:
            - Path=/api/v1/contacts/**

        - id: user-service
          uri: ${user-service-uri:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**

        - id: message-service
          uri: ${message-service-uri:http://localhost:8082}
          predicates:
            - Path=/api/v1/messages/**

        - id: centrifugo
          uri: ${centrifugo-uri:ws://localhost:8000}
          predicates:
            - Path=/api/v1/centrifugo/connection/websocket/**
          filters:
            - RewritePath=/api/v1/centrifugo/connection/websocket, /connection/websocket
  data:
    redis:
      connect-timeout: 1s
      timeout: 1s
      repositories:
        enabled: false
  security:
    oauth2:
      client:
        provider:
          auth-server:
            authorization-uri: ${auth-server.authorization-uri}
            token-uri: ${auth-server.token-uri}
            user-info-uri: ${auth-server.user-info-uri}
            jwk-set-uri: ${auth-server.jwk-set-uri}
            user-name-attribute: ${auth-server.user-name-attribute:sub}
        registration:
          auth-server:
            provider: auth-server
            client-id: ${auth-server.client-id}
            client-secret: ${auth-server.client-secret}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
            redirect-uri: '{baseUrl}/login/oauth2/code/auth-server'
  session:
    redis:
      configure-action: none
      namespace: chat:session
    timeout: 15m

app:
  frontend-url: http://localhost:5173

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, prometheus
