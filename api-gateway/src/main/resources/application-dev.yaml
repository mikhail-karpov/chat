spring:
  cloud:
    gateway:
      routes:
      - id: chat-service
        uri: http://backend:8080
        predicates:
          - Path=/api/v1/messages/**
          - Path=/api/v1/users/**

      - id: centrifugo
        uri: ws://centrifugo:8000
        predicates:
          - Path=/api/v1/centrifugo/connection/websocket/**
        filters:
          - RewritePath=/api/v1/centrifugo/connection/websocket, /connection/websocket

auth-server:
  authorization-uri: http://localhost:9090/realms/chat-dev/protocol/openid-connect/auth
  token-uri: http://keycloak:8080/realms/chat-dev/protocol/openid-connect/token
  user-info-uri: http://keycloak:8080/realms/chat-dev/protocol/openid-connect/userinfo
  jwk-set-uri: http://keycloak:8080/realms/chat-dev/protocol/openid-connect/certs
  client-id: chat-service
  client-secret: eVbKDmG46txrtU96WTIdlLk9FVZMerto