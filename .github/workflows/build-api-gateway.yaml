name: Build Api Gateway

on:
  push:
    branches:
      - main
    paths:
      - ./api-gateway
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - edited
      - synchronize
    paths:
      - ./api-gateway

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build