name: Chat Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'chat-service/**'
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
    paths:
      - 'chat-service/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test Chat Service
        run: ./gradlew :chat-service:build

      - name: Verify test coverage
        run: ./gradlew :chat-service:jacocoTestCoverageVerification