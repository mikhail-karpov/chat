name: Chat Service CI

on:
  push:
    branches: [main]
    paths:
      - 'chat-service/**'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'chat-service/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Build, test and verify coverage
        run: ./gradlew :chat-service:build :chat-service:jacocoTestCoverageVerification

      - name: Upload test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: test-reports-chat-service
          path: chat-service/build/reports/
          retention-days: 7
