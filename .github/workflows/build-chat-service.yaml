name: Chat Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types:
      - opened
      - reopened
      - edited
      - synchronize
    paths:
      - 'chat-service/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test Chat Service
        run: ./gradlew :chat-service:build

      - name: Generate JaCoCo report
        run: ./gradlew :chat-service:jacocoTestReport

      - name: Verify test coverage
        run: ./gradlew :chat-service:jacocoTestCoverageVerification

      - name: Upload coverage reports
        uses: actions/upload-artifact@v3
        with:
          name: chat-service-coverage-reports
          path: |
            chat-service/build/reports/jacoco/test/html
            chat-service/build/reports/jacoco/test/jacocoTestReport.xml