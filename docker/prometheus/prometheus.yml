global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'chat-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'chat-service:8080' ]

  - job_name: 'centrifugo'
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'centrifugo:8000' ]

  - job_name: 'keycloak'
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'keycloak:9000' ]
        labels: { application: 'keycloak'}
